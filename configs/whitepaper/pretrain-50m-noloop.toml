# Whitepaper comparison at 50M tokens (1,526 steps of 32,768), the 500M recipe otherwise:
# configs/pretrain-500m.toml. docs/whitepaper.md describes the runs.
# Same parameters, no recurrence: configs/whitepaper/model-noloop.toml.

model = "configs/whitepaper/model-noloop.toml"
data_dir = "data/prepared-mix50m/pretrain"
run_dir = "runs/wp-noloop"
seed = 42
epochs = 1
max_steps = 0
device = "cuda"
precision = "f32"
peak_tflops = 15.0
val_loops = [1]

[optim]
learning_rate = 6.0e-4
min_learning_rate = 6.0e-5
weight_decay = 0.1
beta1 = 0.9
beta2 = 0.95
epsilon = 1.0e-8
grad_clip = 1.0
warmup_steps = 100

[batch]
micro_batch = 1
tokens_per_step = 32768

[log]
every = 1
val_every = 100
val_sequences = 64

[checkpoint]
every = 250
keep = 2
