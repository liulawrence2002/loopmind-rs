# Whitepaper baseline at 500M tokens: the no-recurrence model on the 500M recipe
# (configs/pretrain-500m.toml), for the main comparison with LoopMind at the same scale.

model = "configs/whitepaper/model-noloop.toml"
data_dir = "data/prepared-500m/pretrain"
run_dir = "runs/wp-500m-noloop"
seed = 42
epochs = 1
max_steps = 0
device = "cuda"
precision = "f32"
peak_tflops = 15.0
val_loops = [1]

[optim]
learning_rate = 6.0e-4
min_learning_rate = 6.0e-5
weight_decay = 0.1
beta1 = 0.9
beta2 = 0.95
epsilon = 1.0e-8
grad_clip = 1.0
warmup_steps = 300

[batch]
micro_batch = 1
tokens_per_step = 32768

[log]
every = 1
val_every = 250
val_sequences = 64

[checkpoint]
every = 250
keep = 64
