# LoopMind default architecture (M0).
# `cargo run -p loopmind -- params` prints the census for this file.
# Dense width 768 is the usual SwiGLU size: two-thirds of 4*d_model,
# rounded up to a multiple of 256. See the README for the parameter table.

d_model = 256
n_q_heads = 4
n_kv_heads = 2
rope_theta = 1000000.0
rms_norm_eps = 1e-6
vocab_size = 6400
tie_embeddings = true
context_length = 1024

n_prelude_layers = 1
n_core_layers = 2
n_coda_layers = 1
dense_intermediate_size = 768

n_experts = 32
expert_intermediate_size = 128
experts_per_token = 2
reroute_every_pass = true

loop_count_mean = 4.0
loop_count_max = 16
bptt_passes = 4
